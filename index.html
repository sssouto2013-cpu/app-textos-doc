<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Busca de Palavras em Arquivos</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.17/mammoth.browser.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

  .hidden {
    display: none !important;
  }

  :root {
    --bg: #0A1A2F;
    --panel: #11263F;
    --text: #E6EEF7;
    --accent: #4EA3FF;
    --accent-hover: #6BB8FF;
    --border: #1F3A57;
    --highlight: #e8f0fe;
    --highlight-dark: #dce8ff;
    --shadow: 0 4px 12px #0005;

    --zoom-normal: 22px;
    --zoom-medium: 26px;
    --zoom-large: 32px;
  }

  body[data-theme="light"] {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --text: #1a1a1a;
    --accent: #0066cc;
    --accent-hover: #3385ff;
    --border: #d0d7e2;
    --highlight: #e2ecff;
    --highlight-dark: #c9dbff;
  }

  body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    font-weight: 600;
  }

  .panel {
    background: var(--panel);
    padding: 20px;
    border-radius: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 25px;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
  }

  button:hover {
    background: var(--accent-hover);
  }

  .list, .results {
    border: 1px solid var(--border);
    padding: 12px;
    max-height: 260px;
    overflow-y: auto;
    background: var(--panel);
    border-radius: 10px;
  }

  .big-term {
    font-size: 34px;
    font-weight: 800;
    color: #0b57d0;
    background: #e8f0fe;
    padding: 14px 18px;
    border-radius: 12px;
    margin: 15px 0;
    text-align: center;
    border: 1px solid #d0e2ff;
  }

  .big-occurrence {
    font-size: var(--zoom-normal);
    line-height: 1.6;
    padding: 14px 18px;
    background: #e8f0fe;
    color: #0b57d0;
    border-radius: 12px;
    margin-bottom: 14px;
    border: 1px solid #d0e2ff;
  }

  .zoom-medium .big-occurrence {
    font-size: var(--zoom-medium);
  }

  .zoom-large .big-occurrence {
    font-size: var(--zoom-large);
  }

  #readingModeExit {
    background: #d9534f;
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 999;
  }
</style>
</head>

<body data-theme="dark">

<h1>Busca de Palavras em Arquivos</h1>

<div style="text-align: right; margin-bottom: 10px;">
  <button id="themeToggle">
    <span class="material-icons">dark_mode</span>
  </button>
</div>

<input type="file" id="keywordPicker" accept=".txt" class="hidden">
<input type="file" id="filesPicker" multiple accept=".txt,.pdf,.doc,.docx" class="hidden">

<button id="readingModeExit" class="hidden">
  <span class="material-icons">arrow_back</span> Voltar ao modo normal
</button>

<div id="mainContent">

  <div class="panel">
    <h2><span class="material-icons">folder_open</span> Pasta de trabalho</h2>
    <button id="chooseFolderBtn">
      <span class="material-icons">folder</span> Escolher pasta
    </button>
  </div>

  <div class="panel">
    <h2><span class="material-icons">description</span> Palavras‑chave (TXT)</h2>
    <button id="loadKeywordsBtn">
      <span class="material-icons">text_snippet</span> Selecionar TXT
    </button>
    <p id="keywordsInfo">Nenhum arquivo carregado.</p>
    <div id="keywordsList" class="list"></div>
  </div>

  <div class="panel">
    <h2><span class="material-icons">picture_as_pdf</span> Arquivos</h2>
    <button id="loadFilesBtn">
      <span class="material-icons">download</span> Selecionar arquivos
    </button>
    <div id="filesSelectList" class="list"></div>
  </div>

  <div class="panel">
    <h2><span class="material-icons">search</span> Teste</h2>

    <button id="startTestBtn">
      <span class="material-icons">play_arrow</span> Sortear termo
    </button>

    <button id="showOccurrencesBtn" disabled>
      <span class="material-icons">visibility</span> Mostrar ocorrências
    </button>

    <button id="zoomBtn" disabled>
      <span class="material-icons">zoom_in</span> Aumentar Zoom
    </button>

    <button id="readingModeBtn" disabled>
      <span class="material-icons">chrome_reader_mode</span> Modo leitura
    </button>

    <button id="endTestBtn" disabled>
      <span class="material-icons">stop</span> Encerrar
    </button>

    <div id="testInfo" class="list"></div>
    <div id="results" class="results"></div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<script>
let folderHandle = null;
let keywords = [];
let usedKeywords = [];
let filesList = [];
let currentTest = { active: false, keyword: "", fileIds: [] };
let zoomLevel = 0;

const pdfjsLib = window['pdfjsLib'];
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const chooseFolderBtn = document.getElementById("chooseFolderBtn");
const loadKeywordsBtn = document.getElementById("loadKeywordsBtn");
const loadFilesBtn = document.getElementById("loadFilesBtn");

const keywordPicker = document.getElementById("keywordPicker");
const filesPicker = document.getElementById("filesPicker");

const keywordsInfoEl = document.getElementById("keywordsInfo");
const keywordsListEl = document.getElementById("keywordsList");
const filesSelectListEl = document.getElementById("filesSelectList");

const startTestBtn = document.getElementById("startTestBtn");
const showOccurrencesBtn = document.getElementById("showOccurrencesBtn");
const zoomBtn = document.getElementById("zoomBtn");
const readingModeBtn = document.getElementById("readingModeBtn");
const readingModeExit = document.getElementById("readingModeExit");
const testInfoEl = document.getElementById("testInfo");
const resultsEl = document.getElementById("results");
const mainContent = document.getElementById("mainContent");

/* TEMA */
themeToggle.onclick = () => {
  document.body.dataset.theme =
    document.body.dataset.theme === "dark" ? "light" : "dark";
};

/* ESCOLHER PASTA */
chooseFolderBtn.onclick = async () => {
  try {
    folderHandle = await window.showDirectoryPicker();
    alert("Pasta selecionada!");
  } catch (err) {
    alert("Erro ao acessar a pasta.");
    console.error(err);
  }
};

/* TXT */
loadKeywordsBtn.onclick = () => keywordPicker.click();

keywordPicker.onchange = async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;

  const raw = await file.text();

  keywords = raw
    .split("\n")
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .flatMap(l => {
      if (l.toUpperCase().startsWith("#TITULO:")) return [];
      l = l.replace(/^#PALAVRAS:/i, "").trim();
      if (l.includes(";")) {
        return l.split(";").map(t => t.trim()).filter(t => t.length > 0);
      }
      return [l];
    });

  usedKeywords = [];

  keywordsInfoEl.textContent =
    `Arquivo TXT carregado: ${file.name} — ${keywords.length} termos.`;

  renderKeywords();
};

function renderKeywords() {
  keywordsListEl.innerHTML = "";
  keywords.forEach((kw, idx) => {
    const div = document.createElement("div");
    const usado = usedKeywords.includes(kw) ? " (já usado)" : "";
    div.textContent = `${idx + 1}. ${kw}${usado}`;
    keywordsListEl.appendChild(div);
  });
}

/* ARQUIVOS */
loadFilesBtn.onclick = () => filesPicker.click();

filesPicker.onchange = async (ev) => {
  const selected = Array.from(ev.target.files);
  filesList = selected.map(f => ({
    name: f.name,
    handle: f,
    text: null
  }));

  renderFilesList();
};

function renderFilesList() {
  filesSelectListEl.innerHTML = "";

  filesList.forEach((file, index) => {
    const label = document.createElement("label");
    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.value = index;
    label.appendChild(chk);
    label.appendChild(document.createTextNode(" " + file.name));
    filesSelectListEl.appendChild(label);
  });
}

/* EXTRAÇÃO DE TEXTO */
async function extrairTextoPdf(file) {
  const arrayBuffer = await file.arrayBuffer();

  try {
    const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
    const pdf = await loadingTask.promise;

    let fullText = "";

    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const textContent = await page.getTextContent();
      const strings = textContent.items.map(item => item.str);
      fullText += strings.join(" ") + "\n";
    }

    if (fullText.trim().length > 0) return fullText;
  } catch (err) {
    console.warn("PDF.js falhou, tentando OCR...");
  }

  return await extrairTextoPorOCR(file);
}

async function extrairTextoPorOCR(file) {
  try {
    const pdfData = await file.arrayBuffer();
    const loadingTask = pdfjsLib.getDocument({ data: pdfData });
    const pdf = await loadingTask.promise;
    const page = await pdf.getPage(1);

    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: context, viewport }).promise;

    const { data: { text } } = await Tesseract.recognize(canvas, 'por');

    return text;
  } catch (err) {
    console.error("OCR falhou:", err);
    return "";
  }
}

async function extrairTextoDocx(file) {
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  return result.value || "";
}

async function extrairTextoDoc(file) {
  try {
    return await file.text();
  } catch {
    return "";
  }
}

async function extrairTextoDeArquivo(obj) {
  if (obj.text !== null) return obj.text;

  const file = obj.handle;
  const name = file.name.toLowerCase();

  let textoFinal = "";

  if (name.endsWith(".pdf")) {
    textoFinal = await extrairTextoPdf(file);
  } else if (name.endsWith(".docx")) {
    textoFinal = await extrairTextoDocx(file);
  } else if (name.endsWith(".doc")) {
    textoFinal = await extrairTextoDoc(file);
  } else if (name.endsWith(".txt")) {
    textoFinal = await file.text();
  }

  obj.text = textoFinal;
  return textoFinal;
}

/* SORTEIO */
startTestBtn.onclick = () => {
  const selectedIds = Array.from(
    filesSelectListEl.querySelectorAll("input[type='checkbox']:checked")
  ).map(cb => Number(cb.value));

  if (selectedIds.length === 0) {
    alert("Selecione arquivos.");
    return;
  }

  if (keywords.length === 0) {
    alert("Carregue o arquivo de palavras‑chave.");
    return;
  }

  let disponiveis = keywords.filter(k => !usedKeywords.includes(k));

  if (disponiveis.length === 0) {
    usedKeywords = [];
    disponiveis = [...keywords];
  }

  const termoEscolhido =
    disponiveis[Math.floor(Math.random() * disponiveis.length)];

  usedKeywords.push(termoEscolhido);

  currentTest.active = true;
  currentTest.keyword = termoEscolhido;
  currentTest.fileIds = selectedIds;

  showOccurrencesBtn.disabled = false;
  zoomBtn.disabled = false;
  readingModeBtn.disabled = false;
  endTestBtn.disabled = false;

  testInfoEl.innerHTML =
    `<p><strong>Teste iniciado</strong></p>
     <p class="big-term">${termoEscolhido}</p>
     <p>Arquivos selecionados: ${selectedIds.map(id => filesList[id].name).join(", ")}</p>`;
};

/* TRECHOS */
function extrairTrechos(texto, termo) {
  const termoLower = termo.toLowerCase();
  const textoLower = texto.toLowerCase();

  const trechos = [];
  let pos = 0;

  while (true) {
    const idx = textoLower.indexOf(termoLower, pos);
    if (idx === -1) break;

    const inicio = Math.max(0, idx - 80);
    const fim = Math.min(texto.length, idx + termo.length + 80);

    trechos.push(texto.substring(inicio, fim));
    pos = idx + termo.length;
  }

  return trechos;
}

/* DESTACAR */
function highlightOccurrences(text, keywords) {
  let result = text;
  keywords.forEach(kw => {
    const escaped = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp(escaped, "gi");
    result = result.replace(regex, m => `<span class="highlight">${m}</span>`);
  });
  return result;
}

/* MOSTRAR OCORRÊNCIAS */
showOccurrencesBtn.onclick = async () => {
  readingModeExit.classList.remove("hidden");

  const termo = currentTest.keyword;
  resultsEl.innerHTML = "<p>Processando arquivos...</p>";

  let totalEncontrados = 0;
  resultsEl.innerHTML = "";
  document.body.classList.remove("zoom-medium", "zoom-large");
  zoomLevel = 0;
  zoomBtn.textContent = "Aumentar Zoom";

  for (const id of currentTest.fileIds) {
    const fileObj = filesList[id];
    const texto = await extrairTextoDeArquivo(fileObj);

    if (!texto || texto.trim().length === 0) continue;

    const trechos = extrairTrechos(texto, termo);

    if (trechos.length > 0) {
      totalEncontrados++;

      const bloco = document.createElement("div");
      bloco.className = "text-block";

      let html = `<strong>${fileObj.name}</strong><br><ul>`;

      trechos.forEach(tr => {
        html += `<li class="big-occurrence">${highlightOccurrences(tr, [termo])}</li>`;
      });

      html += "</ul>";

      bloco.innerHTML = html;
      resultsEl.appendChild(bloco);
    }
  }

  if (totalEncontrados === 0) {
    resultsEl.innerHTML =
      `<p>Nenhum trecho contém o termo <strong>${termo}</strong>.</p>`;
  }
};

/* ZOOM */
zoomBtn.onclick = () => {
  zoomLevel = (zoomLevel + 1) % 3;

  document.body.classList.remove("zoom-medium", "zoom-large");

  if (zoomLevel === 0) {
    zoomBtn.textContent = "Aumentar Zoom";
  } else if (zoomLevel === 1) {
    document.body.classList.add("zoom-medium");
    zoomBtn.textContent = "Zoom Médio";
  } else if (zoomLevel === 2) {
    document.body.classList.add("zoom-large

    zoomBtn.textContent = "Zoom Grande";
  }
};

/* MODO LEITURA */
readingModeBtn.onclick = () => {
  mainContent.classList.add("hidden");
  resultsEl.style.maxHeight = "none";
  resultsEl.style.height = "auto";
};

readingModeExit.onclick = () => {
  mainContent.classList.remove("hidden");
  readingModeExit.classList.add("hidden");
  resultsEl.style.maxHeight = "260px";
};

/* ENCERRAR */
endTestBtn.onclick = () => {
  currentTest.active = false;
  currentTest.keyword = "";
  currentTest.fileIds = [];

  showOccurrencesBtn.disabled = true;
  zoomBtn.disabled = true;
  readingModeBtn.disabled = true;
  endTestBtn.disabled = true;

  resultsEl.innerHTML = "<p>Teste encerrado.</p>";
  testInfoEl.innerHTML = "";

  filesSelectListEl.querySelectorAll("input[type='checkbox']").forEach(cb => {
    cb.checked = false;
  });

  document.body.classList.remove("zoom-medium", "zoom-large");
  zoomLevel = 0;
  zoomBtn.textContent = "Aumentar Zoom";
};

/* INICIALIZAÇÃO */
keywords = [];
usedKeywords = [];
filesList = [];
</script>

</body>
</html>
